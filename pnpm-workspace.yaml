packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/engines": true
  "@scarf/scarf": false
  "esbuild@0.28.2": true
  lefthook: true
  prisma: true

# Correções temporárias de segurança em dependências transitivas cujos pacotes pais ainda
# não adotaram as versões corrigidas. Remova cada entrada quando o pacote pai for atualizado.
overrides:
  # GHSA-52cp-r559-cp3m / GHSA-5p4m-2wfm-xmqj — consumo quadrático de CPU no js-yaml.
  # O parser do Hey API fixa 4.2.0 e o cosmiconfig ainda resolve essa versão vulnerável.
  "@hey-api/json-schema-ref-parser@1.4.4>js-yaml": 4.3.1
  "cosmiconfig@9.0.2>js-yaml": 4.3.1
  # GHSA-ggr8-5vv4-36mx — exaustão de pilha ao mesclar grafos recursivos (@prisma/config).
  deepmerge-ts: 8.0.2
  # GHSA-3f6p-5ww8-9rcr — downgrade de plugin de autenticação vaza credencial em texto aberto.
  # O driver MySQL não é usado por este projeto, que fala apenas com PostgreSQL.
  mysql2: 3.24.2

engineStrict: true
saveExact: true
sharedWorkspaceLockfile: true
strictPeerDependencies: true
