name: Commit validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

concurrency:
  cancel-in-progress: true
  group: commits-${{ github.ref }}

permissions:
  contents: read

jobs:
  commits:
    name: Validate commits
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install commitlint
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate PR title and commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf '%s\n' "$PR_TITLE" | pnpm commitlint
          fi

          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          else
            pnpm commitlint --last --verbose
          fi
