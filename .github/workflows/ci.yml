name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  verify:
    name: Validate workspace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      DATABASE_URL: postgresql://sistema_erp:ci_only@localhost:5432/sistema_erp?schema=public
      NODE_ENV: test
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: sistema_erp
          POSTGRES_PASSWORD: ci_only
          POSTGRES_USER: sistema_erp
        options: >-
          --health-cmd "pg_isready -U sistema_erp -d sistema_erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check generated API artifacts
        run: pnpm contracts:check

      - name: Install Chromium
        run: pnpm test:e2e:install

      - name: Run end-to-end test
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: ignore
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
