name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  cancel-in-progress: true
  group: ci-${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  commits:
    name: Validate commits
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install commitlint
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate PR title and commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf '%s\n' "$PR_TITLE" | pnpm commitlint
          fi

          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            pnpm commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          else
            pnpm commitlint --last --verbose
          fi

  secrets:
    name: Scan secrets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  scope:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | awk '$0 !~ /\.md$/ { found=1 } END { exit(found ? 0 : 1) }'; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

  documentation:
    name: Validate documentation
    needs: scope
    if: needs.scope.outputs.full != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check documentation changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"

  full:
    name: Run full validation
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      DATABASE_URL: postgresql://sistema_erp:ci_only@localhost:5432/sistema_erp?schema=public
      NODE_ENV: test
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_DB: sistema_erp
          POSTGRES_PASSWORD: ci_only
          POSTGRES_USER: sistema_erp
        options: >-
          --health-cmd "pg_isready -U sistema_erp -d sistema_erp"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate:deploy

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check generated API artifacts
        run: pnpm contracts:check

      - name: Install Chromium
        run: pnpm test:e2e:install

      - name: Run end-to-end test
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  verify:
    name: Validate workspace
    needs: [commits, secrets, scope, documentation, full]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check selected validation
        env:
          COMMITS_RESULT: ${{ needs.commits.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          FULL_REQUIRED: ${{ needs.scope.outputs.full }}
          FULL_RESULT: ${{ needs.full.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: |
          if [ "$COMMITS_RESULT" != "success" ] || [ "$SECRETS_RESULT" != "success" ] || [ "$SCOPE_RESULT" != "success" ]; then
            exit 1
          fi

          if [ "$FULL_REQUIRED" = "true" ]; then
            [ "$FULL_RESULT" = "success" ]
          else
            [ "$DOCUMENTATION_RESULT" = "success" ]
          fi
